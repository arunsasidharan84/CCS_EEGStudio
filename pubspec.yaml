name: ccs_eeg_app
description: Lightweight EEG feature extraction and connectivity desktop app.
publish_to: none
version: 1.2.10+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/group_stats.py
    - assets/source_regions.json
  uses-material-design: true
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
